<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <title>Рейтинг легенд класса</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      /* светлее низ, без провала в чёрный */
      --bg0:#0a1a11;
      --bg1:#0e2417;

      --glass: rgba(255,255,255,.09);
      --glass2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.16);

      --text:#F2F6F3;
      --muted: rgba(242,246,243,.72);
      --muted2: rgba(242,246,243,.52);

      --shadow: 0 18px 42px rgba(0,0,0,.38);
      --radius:20px;

      --tap: .97;
      --ok: rgba(168,255,211,.95);

      --barBg: rgba(255,255,255,.10);
      --barFill: rgba(214, 255, 232, .92);

      --danger: rgba(255, 178, 178, .92);
      --dangerBg: rgba(255, 95, 95, .10);
      --btnBg: rgba(255,255,255,.08);
      --btnBorder: rgba(255,255,255,.14);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    html, body{
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden; /* iPhone: не скроллим body */
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background:
        radial-gradient(1100px 680px at 10% -12%, rgba(56,160,104,.45), transparent 60%),
        radial-gradient(900px 560px at 100% 0%, rgba(28,90,56,.45), transparent 60%),
        radial-gradient(900px 640px at 60% 110%, rgba(48,150,96,.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    .app{
      height:100vh;
      width:100vw;
      position:relative;
      isolation:isolate;
    }

    /* subtle grain */
    .app::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.055;
      z-index:0;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.45'/></svg>");
      mix-blend-mode: overlay;
    }

    /* military grid */
    .app::after{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      z-index:0;
      opacity:.07;
      background-image:
        linear-gradient(rgba(242,246,243,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242,246,243,.18) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px;
      mask-image: radial-gradient(closest-side at 50% 20%, rgba(0,0,0,.95), transparent 70%);
    }

    /* decorative tank */
    .tankDecor{
      position:absolute;
      right:-34px;
      bottom: calc(-14px + env(safe-area-inset-bottom));
      width: 240px;
      height: 170px;
      z-index:0;
      opacity:.11; /* 0.08–0.14 */
      filter: blur(.2px) drop-shadow(0 10px 22px rgba(0,0,0,.18));
      pointer-events:none;
      transform: rotate(-2deg);
    }

    /* внутренний скролл вместо body */
    .scroll{
      height:100vh;
      overflow-y:auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding: 22px 18px calc(26px + env(safe-area-inset-bottom)) 18px;
      position:relative;
      z-index:1;
    }

    .header{
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding-top: 6px;
      margin-bottom: 18px;
    }

    .avatar{
      width:78px;
      height:78px;
      border-radius:999px;
      object-fit:cover;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 14px 32px rgba(0,0,0,.40);
      background: rgba(255,255,255,.06);
      margin-bottom: 10px;
      transform: translateZ(0);
    }

    h1{
      margin:0;
      font-size: 22px;
      letter-spacing: .2px;
      line-height: 1.15;
    }

    .badge{
      margin-top: 8px;
      font-size: 12.5px;
      color: rgba(242,246,243,.82);
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      padding: 6px 10px;
      border-radius: 999px;
      letter-spacing: .6px;
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
    }

    .subtitle{
      margin: 10px 0 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .glass{
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    .progressWrap{
      padding: 14px 14px 12px 14px;
      margin-bottom: 14px;
      animation: fadeIn .22s ease both;
    }

    .progressTop{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:baseline;
      margin-bottom: 10px;
    }

    .progressTitle{
      font-size: 14px;
      color: var(--muted);
    }

    .progressPct{
      font-size: 13px;
      color: var(--muted2);
      font-variant-numeric: tabular-nums;
    }

    .progressBar{
      width:100%;
      height:10px;
      border-radius:999px;
      background: var(--barBg);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
      transform-origin:center;
    }
    .progressBar > div{
      height:100%;
      width:0%;
      border-radius:999px;
      background: var(--barFill);
      transition: width .42s cubic-bezier(.2,.85,.2,1);
      box-shadow: 0 8px 18px rgba(180,255,220,.18);
    }

    .progressBar.bump{
      animation: bump .12s ease;
    }
    @keyframes bump{
      from{ transform: scaleY(1); }
      50%{ transform: scaleY(1.05); }
      to{ transform: scaleY(1); }
    }

    .cards{
      display:flex;
      flex-direction:column;
      gap: 12px;
      margin-top: 12px;
    }

    .card{
      padding: 14px 14px;
      cursor:pointer;
      user-select:none;
      transform: translateZ(0);
      transition: transform .14s ease, border-color .2s ease, background .2s ease, opacity .2s ease;
      position:relative;
      overflow:hidden;
      animation: cardIn .46s cubic-bezier(.2,.85,.2,1) both;
    }

    .card.readonly{
      cursor: default;
      opacity: .90;
      border-color: rgba(255,255,255,.12);
    }
    .card.readonly:active{ transform:none; }

    @keyframes cardIn{
      from{ opacity:0; transform: translateY(10px); filter: blur(8px); }
      to{ opacity:1; transform: translateY(0); filter: blur(0); }
    }

    @media (hover:hover){
      .card:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.24); }
      .card.readonly:hover{ transform:none; border-color: rgba(255,255,255,.14); }
    }

    .card:active{ transform: scale(var(--tap)); }

    .cardRow{
      display:flex;
      gap: 12px;
      align-items:flex-start;
    }

    .emoji{
      font-size: 20px;
      line-height: 1;
      width: 28px;
      text-align:center;
      margin-top: 1px;
      flex: 0 0 28px;
    }

    .cardMeta{
      flex: 1 1 auto;
      min-width: 0;
    }

    .cardTitle{
      font-size: 16px;
      line-height: 1.2;
      margin: 0;
    }

    .cardDesc{
      margin: 6px 0 0 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.25;
    }

    /* отдельная иерархия для “выберите кандидата” */
    .chooseHint{
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted2);
      letter-spacing: .6px;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .chooseHint .arrow{
      opacity:.9;
      font-weight:700;
    }

    .cardStatus{
      flex:0 0 auto;
      font-size: 14px;
      color: rgba(242,246,243,.78);
      display:flex;
      align-items:center;
      gap:6px;
    }

    .check{
      width: 18px;
      height: 18px;
      border-radius: 6px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background: rgba(180,255,220,.14);
      border: 1px solid rgba(180,255,220,.28);
      color: var(--ok);
      font-weight: 700;
      font-size: 12px;
    }

    .pickedLine{
      margin-top: 10px;
      font-size: 14px;
      color: rgba(242,246,243,.92);
      display:flex;
      align-items:center;
      gap: 8px;
    }

    .mutedHint{
      margin-top: 12px;
      font-size: 12.5px;
      color: var(--muted2);
      line-height: 1.35;
    }

    .topBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 2px 0 14px 0;
    }

    .backBtn{
      appearance:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 14px;
      cursor:pointer;
      transition: transform .14s ease;
    }
    .backBtn:active{ transform: scale(var(--tap)); }

    .pillList{
      display:flex;
      flex-direction:column;
      gap: 10px;
      margin-top: 12px;
    }

    .pill{
      appearance:none;
      width:100%;
      border-radius: 999px;
      padding: 13px 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.07);
      color: rgba(242,246,243,.96);
      text-align:left;
      font-size: 15px;
      line-height: 1.15;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      transition: transform .14s ease, border-color .2s ease, background .2s ease;
    }
    .pill:active{ transform: scale(var(--tap)); }
    .pill small{ color: var(--muted2); font-size: 12.5px; }

    .pill[disabled]{
      opacity: .45;
      cursor:not-allowed;
      transform:none !important;
    }

    .section{
      padding: 14px 14px;
      margin-bottom: 12px;
      animation: fadeIn .22s ease both;
    }

    .sectionTitle{
      margin:0 0 10px 0;
      font-size: 15px;
      color: rgba(242,246,243,.92);
    }

    .ol{
      margin: 0;
      padding-left: 18px;
      color: rgba(242,246,243,.92);
      font-size: 14px;
      line-height: 1.35;
    }

    .legend{
      margin-top: 10px;
      font-size: 15px;
      color: rgba(242,246,243,.95);
    }

    /* CTA */
    .ctaBtn{
      appearance:none;
      width:100%;
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid var(--btnBorder);
      background: var(--btnBg);
      color: var(--text);
      font-size: 14px;
      cursor:pointer;
      transition: transform .14s ease, border-color .2s ease;
      margin-top: 12px;
    }
    .ctaBtn:active{ transform: scale(var(--tap)); }
    .ctaBtn[disabled]{ opacity:.5; cursor:not-allowed; transform:none !important; }

    /* error panel */
    .errorBox{
      background: var(--dangerBg);
      border: 1px solid rgba(255, 160, 160, .28);
      border-radius: var(--radius);
      padding: 14px 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      animation: fadeIn .22s ease both;
    }
    .errorTitle{
      margin:0;
      font-size: 15px;
      color: var(--danger);
    }
    .errorText{
      margin: 10px 0 0 0;
      font-size: 13px;
      color: rgba(242,246,243,.85);
      line-height: 1.35;
    }
    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      color: rgba(242,246,243,.72);
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* loading overlay */
    .loading{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap: 10px;
      background:
        radial-gradient(1000px 680px at 10% -12%, rgba(56,160,104,.32), transparent 60%),
        linear-gradient(180deg, rgba(10,22,15,.96), rgba(10,22,15,.98));
      z-index: 50;
      transition: opacity .28s ease;
    }

    .spinner{
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,.22);
      border-top-color: rgba(255,255,255,.72);
      animation: spin .8s linear infinite;
    }

    @keyframes spin{ to{ transform: rotate(360deg); } }

    .loadingText{
      font-size: 13px;
      color: rgba(242,246,243,.72);
    }

    body.ready .loading{
      opacity:0;
      pointer-events:none;
    }

    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loadingText" id="loadingText">Загрузка…</div>
  </div>

  <div class="app">
    <!-- decorative tank (SVG silhouette) -->
    <svg class="tankDecor" viewBox="0 0 520 360" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="rgba(242,246,243,1)" d="M160 170h210l40-26h48v28h-20l-16 26h-46l-8 24H140l20-52z"/>
      <path fill="rgba(242,246,243,1)" d="M220 132h120l22 38H198l22-38z"/>
      <path fill="rgba(242,246,243,1)" d="M300 108h92v18h-92v-18z"/>
      <path fill="rgba(242,246,243,1)" d="M120 222h260c28 0 52 20 56 46l6 44H98l6-44c4-26 28-46 56-46z"/>
      <circle cx="170" cy="310" r="28" fill="rgba(242,246,243,1)"/>
      <circle cx="250" cy="310" r="28" fill="rgba(242,246,243,1)"/>
      <circle cx="330" cy="310" r="28" fill="rgba(242,246,243,1)"/>
      <circle cx="410" cy="310" r="28" fill="rgba(242,246,243,1)"/>
    </svg>

    <div class="scroll" id="scroll">
      <header class="header">
        <img class="avatar" src="feb.png" alt="Feb23" />
        <h1>Рейтинг легенд класса</h1>
        <div class="badge">🪖 Feb23</div>
        <p class="subtitle" id="subtitle">Голосование до 24 февраля</p>
      </header>

      <main id="view"></main>
    </div>
  </div>

  <script>
  (() => {
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    // ВАЖНО: если фронт на GitHub Pages (feb23.temo4ka4.ru), то /api на этом домене нет.
    // Поэтому даём fallback на домен, где у тебя реально работает API.
    const FALLBACK_API_BASE = "https://api.temo4ka4.ru";

    const INTRO_KEY = "feb23_intro_seen";

    const loadingTextEl = document.getElementById("loadingText");
    const viewEl = document.getElementById("view");
    const subtitleEl = document.getElementById("subtitle");

    const qs = new URLSearchParams(location.search);
    const fallbackAuth = {
      uid: qs.get("uid") || "",
      ts: qs.get("ts") || "",
      sig: qs.get("sig") || "",
    };

    const initData = tg ? (tg.initData || "") : "";
    const initUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;

    let state = null;
    let results = null;
    let lastProgress = 0;

    function setReady() { document.body.classList.add("ready"); }
    function setLoading(msg) { loadingTextEl.textContent = msg || "Загрузка…"; }

    function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

    function haptic(){
      try{
        if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
          tg.HapticFeedback.impactOccurred("light");
        }
      }catch(_){}
    }

    function showErrorPopup(message) {
      const msg = String(message || "Ошибка");
      if (tg && tg.showPopup) {
        tg.showPopup({ title: "Ошибка", message: msg, buttons: [{type:"ok"}] });
      } else if (tg && tg.showAlert) {
        tg.showAlert(msg);
      } else {
        alert(msg);
      }
    }

    function withAuthUrl(path) {
      if (initData) return path;
      const hasAll = fallbackAuth.uid && fallbackAuth.ts && fallbackAuth.sig;
      if (!hasAll) return path;
      const sep = path.includes("?") ? "&" : "?";
      return path + sep + new URLSearchParams(fallbackAuth).toString();
    }

    async function fetchText(url, opts = {}) {
      const res = await fetch(url, opts);
      const text = await res.text();
      return {res, text};
    }

    async function guessApiBase() {
      if (window.FEB23_API_BASE) {
        return String(window.FEB23_API_BASE).replace(/\/+$/, "");
      }

      const sameOrigin = "";
      try {
        const url = sameOrigin + withAuthUrl("/api/feb23/state");
        const headers = initData ? {"X-Telegram-InitData": initData} : {};
        const {res, text} = await fetchText(url, {headers});
        if (res.ok) {
          try { JSON.parse(text); return sameOrigin; } catch (_) {}
        }
      } catch (_) {}

      return FALLBACK_API_BASE.replace(/\/+$/, "");
    }

    async function api(apiBase, path, opts = {}) {
      const url = apiBase + withAuthUrl(path);
      const headers = Object.assign({"Content-Type":"application/json"}, (opts.headers || {}));
      if (initData) headers["X-Telegram-InitData"] = initData;

      const {res, text} = await fetchText(url, Object.assign({}, opts, {headers}));

      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (_) {}

      if (!res.ok) {
        const detail = (data && (data.detail || data.error)) ? (data.detail || data.error) : (text || "Ошибка запроса");
        const err = new Error(String(detail));
        err.__status = res.status;
        throw err;
      }
      return data;
    }

    function applyTheme() {
      if (!tg || !tg.themeParams) return;
      const tp = tg.themeParams;
      // Не даём тёмный текст: если Telegram вдруг отдаст странное — не трогаем.
      try {
        tg.setHeaderColor && tg.setHeaderColor("#0b150f");
        tg.setBackgroundColor && tg.setBackgroundColor("#0b150f");
      } catch(_) {}
    }

    function getMemberNameById(id) {
      const mid = Number(id);
      const m = (state && state.members) ? state.members.find(x => Number(x.id) === mid) : null;
      return m ? m.name : ("#" + mid);
    }

    function getCategoryById(id) {
      const cid = Number(id);
      const c = (state && state.categories) ? state.categories.find(x => Number(x.id) === cid) : null;
      return c || null;
    }

    function renderErrorScreen(apiBase, err) {
      const msg = String(err && err.message ? err.message : err || "Ошибка");
      subtitleEl.textContent = "Не удалось загрузить данные";

      const hint =
        (!initData && !(fallbackAuth.uid && fallbackAuth.ts && fallbackAuth.sig))
          ? "Вы открыли страницу вне Telegram. Откройте через кнопку в боте или используйте подписанный URL (?uid&ts&sig)."
          : "Проверьте, что API доступен и настроен прокси / CORS.";

      viewEl.innerHTML = `
        <div class="errorBox">
          <div class="errorTitle">Данные не загрузились</div>
          <div class="errorText">${hint}</div>
          <div class="mono">apiBase: ${apiBase || "(same-origin)"}\nerror: ${msg}</div>
          <button class="ctaBtn" id="retryBtn">Повторить</button>
        </div>
      `;

      document.getElementById("retryBtn").addEventListener("click", () => location.reload());
    }

    function renderIntro() {
      if (!state) return;
      const status = String(state.event_status || "closed");

      subtitleEl.textContent = "5 категорий • 1 голос в каждой";

      const cta = (status === "open")
        ? `<button class="ctaBtn" id="introGo">Приступить к выбору</button>`
        : `<button class="ctaBtn" id="introResults">Смотреть итоги</button>`;

      viewEl.innerHTML = `
        <div class="section glass">
          <div class="sectionTitle">Рейтинг легенд класса</div>

          <div class="mutedHint" style="margin-top:0;color:rgba(242,246,243,.88);font-size:14px;">
            Это короткое голосование из 5 категорий — выбираешь легенд по разным ролям.
          </div>

          <div class="mutedHint" style="color:var(--muted);font-size:13px;">
            Важно: голос фиксируется сразу после подтверждения и <b>не может быть изменён</b>.
          </div>

          <div class="sectionTitle" style="margin-top:14px;">Что получают победители</div>
          <div class="mutedHint" style="margin-top:0;font-size:13px;">
            🥇 уважение класса<br/>
            🥈 упоминание в итогах<br/>
            🥉 мем-статус (легально)
          </div>

          ${cta}
        </div>
      `;

      if (status === "open") {
        document.getElementById("introGo").addEventListener("click", () => {
          localStorage.setItem(INTRO_KEY, "1");
          routeAfterState();
        });
      } else {
        document.getElementById("introResults").addEventListener("click", () => {
          localStorage.setItem(INTRO_KEY, "1");
          renderResults();
        });
      }
    }

    function routeAfterState() {
      const status = String(state.event_status || "closed");
      const progress = Number(state.progress_count || 0);

      if (!localStorage.getItem(INTRO_KEY)) {
        renderIntro();
        return;
      }

      if (status !== "open") {
        renderResults();
        return;
      }

      if (progress >= 5) renderDone();
      else renderHome();
    }

    function bounceProgress() {
      const bar = document.querySelector(".progressBar");
      if (!bar) return;
      bar.classList.remove("bump");
      // force reflow
      void bar.offsetWidth;
      bar.classList.add("bump");
      setTimeout(() => bar.classList.remove("bump"), 160);
    }

    function renderHome() {
      if (!state) return;

      const total = 5;
      const progress = Number(state.progress_count || 0);
      const pct = Math.max(0, Math.min(100, Math.round((progress / total) * 100)));
      const status = String(state.event_status || "closed");
      const myVotes = state.my_votes || {};

      subtitleEl.textContent = (status === "open")
        ? "Голосование до 24 февраля"
        : "Голосование завершено";

      const topBtn = (status === "open")
        ? (progress >= 5 ? `<button class="ctaBtn" disabled>Голосование завершено</button>` : ``)
        : `<button class="ctaBtn" id="goResults">Смотреть итоги</button>`;

      const progressHtml = `
        <div class="progressWrap glass">
          <div class="progressTop">
            <div class="progressTitle">Вы проголосовали в <b>${progress}/${total}</b> категорий</div>
            <div class="progressPct">${pct}%</div>
          </div>
          <div class="progressBar"><div style="width:${pct}%"></div></div>
          ${topBtn}
        </div>
      `;

      const cardsHtml = (state.categories || []).map((c, idx) => {
        const votedTarget = myVotes[String(c.id)];
        const voted = (typeof votedTarget !== "undefined");
        const name = voted ? getMemberNameById(votedTarget) : "";

        const hint = voted
          ? `<div class="pickedLine"><span class="check">✓</span><span>${name}</span></div>`
          : (status === "open"
              ? `<div class="chooseHint"><span class="arrow">→</span><span>Выберите кандидата</span></div>`
              : `<div class="mutedHint">Голосование завершено</div>`);

        return `
          <div class="card glass ${voted || status!=="open" ? "readonly" : ""}"
               data-cat="${c.id}"
               style="animation-delay:${idx * 70}ms;">
            <div class="cardRow">
              <div class="emoji">${c.emoji}</div>
              <div class="cardMeta">
                <div class="cardTitle">${c.title}</div>
                <div class="cardDesc">${c.description}</div>
                ${hint}
              </div>
              <div class="cardStatus">${voted ? `<span class="check">✓</span>` : ``}</div>
            </div>
          </div>
        `;
      }).join("");

      viewEl.innerHTML = `
        ${progressHtml}
        <div class="cards">${cardsHtml}</div>
      `;

      const goResults = document.getElementById("goResults");
      if (goResults) goResults.addEventListener("click", () => renderResults());

      // клики по карточкам: если уже проголосовал — показываем просмотр выбора
      viewEl.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => {
          const catId = Number(el.getAttribute("data-cat"));
          const votedTarget = myVotes[String(catId)];

          if (typeof votedTarget !== "undefined") {
            renderViewChoice(catId);
            return;
          }

          if (status !== "open") {
            renderResults();
            return;
          }

          renderPick(catId);
        });
      });

      // микро: если прогресс вырос — bump + haptic
      if (progress > lastProgress) {
        haptic();
        bounceProgress();
      }
      lastProgress = progress;
    }

    function renderViewChoice(categoryId) {
      if (!state) return;
      const c = getCategoryById(categoryId);
      if (!c) { showErrorPopup("Категория не найдена."); return; }

      const myVotes = state.my_votes || {};
      const tid = myVotes[String(categoryId)];
      const name = (typeof tid !== "undefined") ? getMemberNameById(tid) : null;

      subtitleEl.textContent = `${c.emoji} ${c.title}`;

      viewEl.innerHTML = `
        <div class="topBar">
          <button class="backBtn" id="backBtn">← Назад</button>
          <div style="font-size:13px;color:var(--muted2);">Изменение запрещено</div>
        </div>

        <div class="section glass">
          <div class="sectionTitle">${c.emoji} ${c.title}</div>
          <div class="mutedHint" style="margin-top:0;color:var(--muted);">${c.description}</div>

          <div class="mutedHint" style="margin-top:14px;color:rgba(242,246,243,.9);font-size:14px;">
            ${name ? `Вы уже проголосовали и отдали голос за <b>${name}</b>.` : `Вы не голосовали в этой категории.`}
          </div>

          <button class="ctaBtn" disabled>${name ? "Вы уже проголосовали" : "Недоступно"}</button>
        </div>
      `;

      document.getElementById("backBtn").addEventListener("click", () => {
        if (Number(state.progress_count || 0) >= 5) renderDone();
        else renderHome();
      });
    }

    function renderDone() {
      if (!state) return;

      subtitleEl.textContent = "Голосование завершено";

      const myVotes = state.my_votes || {};
      const items = (state.categories || []).map(c => {
        const tid = myVotes[String(c.id)];
        const name = getMemberNameById(tid);
        return `<div class="mutedHint" style="font-size:14px;color:rgba(242,246,243,.92);margin:10px 0;">
          ${c.emoji} <b>${c.title}</b> — ${name}
        </div>`;
      }).join("");

      viewEl.innerHTML = `
        <div class="section glass">
          <div class="sectionTitle">Голосование завершено</div>
          <div class="mutedHint">Вы уже отдали голос во всех 5 категориях. Редактирование запрещено.</div>
          <div style="margin-top:6px;">${items}</div>
          <button class="ctaBtn" disabled>Голосование завершено</button>
        </div>
      `;

      // клики по списку — только просмотр
      // (если захочешь: можно сделать список кликабельным, но ты это не просил)
    }

    function renderPick(categoryId) {
      if (!state) return;

      const myVotes = state.my_votes || {};
      if (typeof myVotes[String(categoryId)] !== "undefined") {
        renderViewChoice(categoryId);
        return;
      }

      const c = getCategoryById(categoryId);
      if (!c) { showErrorPopup("Категория не найдена."); return; }

      subtitleEl.textContent = `${c.emoji} ${c.title}`;

      const members = state.members || [];
      const myNameFirst = initUser ? String(initUser.first_name || "").trim() : "";
      const myNameLast = initUser ? String(initUser.last_name || "").trim() : "";
      const myFull = (myNameFirst + " " + myNameLast).trim().toLowerCase().replace("ё","е");
      const myFirst = myNameFirst.toLowerCase().replace("ё","е");

      function isSelfCandidate(name) {
        const n = String(name || "").trim().toLowerCase().replace("ё","е");
        if (!n) return false;
        if (myFull && n === myFull) return true;
        if (myFirst && !n.includes(" ") && n === myFirst) return true;
        return false;
      }

      const pills = members.map((m) => {
        const disabled = isSelfCandidate(m.name);
        return `
          <button class="pill" data-mid="${m.id}" ${disabled ? "disabled" : ""}>
            <span>🪖 ${m.name}</span>
            <small>${disabled ? "нельзя" : "выбрать"}</small>
          </button>
        `;
      }).join("");

      viewEl.innerHTML = `
        <div class="topBar">
          <button class="backBtn" id="backBtn">← Назад</button>
          <div style="font-size:13px;color:var(--muted2);">Голос фиксируется сразу</div>
        </div>

        <div class="section glass">
          <div class="sectionTitle">${c.emoji} ${c.title}</div>
          <div class="mutedHint" style="margin-top:0;color:var(--muted);">${c.description}</div>
          <div class="chooseHint"><span class="arrow">→</span><span>Выберите кандидата</span></div>
          <div class="pillList">${pills}</div>
        </div>
      `;

      document.getElementById("backBtn").addEventListener("click", () => renderHome());

      viewEl.querySelectorAll(".pill").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (btn.disabled) return;

          const memberId = Number(btn.getAttribute("data-mid"));
          const memberName = members.find(x => Number(x.id) === memberId)?.name || ("#" + memberId);

          const doVote = async () => {
            try {
              await api(window.__FEB23_API_BASE, "/api/feb23/vote", {
                method: "POST",
                body: JSON.stringify({ category_id: categoryId, target_user_id: memberId })
              });

              state = await api(window.__FEB23_API_BASE, "/api/feb23/state");

              if (String(state.event_status) !== "open") {
                results = await api(window.__FEB23_API_BASE, "/api/feb23/results");
                renderResults();
                return;
              }

              if (Number(state.progress_count || 0) >= 5) renderDone();
              else renderHome();
            } catch (e) {
              // если сервер сказал "уже голосовал" — не ругаемся, показываем просмотр
              try{
                state = await api(window.__FEB23_API_BASE, "/api/feb23/state");
                const myVotes2 = state.my_votes || {};
                if (typeof myVotes2[String(categoryId)] !== "undefined") {
                  renderViewChoice(categoryId);
                  return;
                }
              }catch(_){}
              showErrorPopup(e.message || e);
            }
          };

          if (tg && tg.showPopup) {
            tg.showPopup({
              title: "Подтвердить голос",
              message: `${c.emoji} ${c.title}\n→ ${memberName}\n\nГолос нельзя будет изменить.`,
              buttons: [
                {id: "vote", type: "default", text: "Голосовать"},
                {id: "cancel", type: "cancel", text: "Отмена"}
              ]
            }, (btnId) => { if (btnId === "vote") doVote(); });
          } else {
            if (confirm(`Голос: ${c.title} → ${memberName}\n\nГолос нельзя будет изменить. Продолжить?`)) doVote();
          }
        });
      });
    }

    function renderResults() {
      if (!state || !results) return;

      subtitleEl.textContent = "Итоги голосования";

      const cats = results.categories || state.categories || [];
      const top = results.top3_by_category || {};
      const legend = results.legend;

      const blocks = cats.map(c => {
        const list = (top[String(c.id)] || []);
        const medals = ["🥇", "🥈", "🥉"];

        let items = "";
        if (!list.length) {
          items = `<div class="mutedHint">— пока нет голосов</div>`;
        } else {
          items = `<ol class="ol">${
            list.map((x, i) => `<li>${medals[i]} ${x.name} — ${x.votes} голосов</li>`).join("")
          }</ol>`;
        }

        return `
          <div class="section glass">
            <div class="sectionTitle">${c.emoji} ${c.title}</div>
            ${items}
          </div>
        `;
      }).join("");

      const legendHtml = legend
        ? `<div class="section glass">
             <div class="sectionTitle">🏆 Легенда класса</div>
             <div class="legend"><b>${legend.name}</b> — ${legend.votes_total} голосов</div>
           </div>`
        : `<div class="section glass">
             <div class="sectionTitle">🏆 Легенда класса</div>
             <div class="mutedHint">Пока не определена — нет голосов.</div>
           </div>`;

      viewEl.innerHTML = `${blocks}${legendHtml}`;
    }

    async function boot() {
      const t0 = Date.now();

      try {
        setLoading("Подготовка…");

        if (tg) {
          tg.ready();
          tg.expand();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); // iPhone: не закрывать на swipe вниз
        }
        applyTheme();

        setLoading("Подключаемся…");
        const apiBase = await guessApiBase();
        window.__FEB23_API_BASE = apiBase;

        setLoading("Загружаем данные…");
        state = await api(apiBase, "/api/feb23/state");

        // prefetch результатов если закрыто
        if (String(state.event_status) !== "open") {
          results = await api(apiBase, "/api/feb23/results");
        }

        // минимум 3 секунды лоадинг
        const elapsed = Date.now() - t0;
        if (elapsed < 3000) await delay(3000 - elapsed);

        // стартовая навигация
        lastProgress = Number(state.progress_count || 0);
        routeAfterState();

        setReady();
      } catch (e) {
        // тоже держим минимум 3 секунды лоадинг
        const elapsed = Date.now() - t0;
        if (elapsed < 3000) await delay(3000 - elapsed);

        setReady();
        renderErrorScreen(window.__FEB23_API_BASE || "", e);
      }
    }

    boot();
  })();
  </script>
</body>
</html>
